<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Creator Co-Op | Boost Queue</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0b1326">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Creator Co-Op">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  
  <!-- Primary Icon - Your New Logo (try first) -->
  <link rel="apple-touch-icon" href="icons/co-creators.png">
  
  <!-- Fallback to old working icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-200.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-150.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-100.png">
  
  <!-- Windows / Android -->
  <meta name="msapplication-TileImage" content="icons/icon-150.png">
  <meta name="msapplication-TileColor" content="#0b1326">
  
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0c; font-family: 'Inter', sans-serif; color: #e5e7eb; }
    .glass-card { background: rgba(17, 17, 20, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(133, 147, 151, 0.1); transition: all 0.2s; }
    .sidebar-item { transition: all 0.2s; cursor: pointer; border-left: 3px solid transparent; }
    .sidebar-item:hover { background: #1e293b; color: #2fd9f4; }
    .sidebar-active { border-left-color: #2fd9f4; background: rgba(47, 217, 244, 0.1); color: #2fd9f4; }
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 12, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(133, 147, 151, 0.2);
      z-index: 50;
      padding-top: env(safe-area-inset-top, 20px);
    }
    .bottom-tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 12, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(133, 147, 151, 0.2);
      display: none;
      justify-content: space-around;
      padding: 8px 16px;
      padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
      z-index: 50;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: color 0.2s;
    }
    .tab-item span:first-child { font-size: 24px; }
    .tab-item span:last-child { font-size: 10px; font-weight: 500; }
    @media (max-width: 767px) {
      .bottom-tab-bar { display: flex; }
      .desktop-sidebar { display: none; }
      main { margin-top: calc(env(safe-area-inset-top, 20px) + 56px); margin-bottom: calc(env(safe-area-inset-bottom, 0) + 70px); padding: 1rem; }
    }
    @media (min-width: 768px) {
      .desktop-sidebar { display: flex; flex-direction: column; width: 260px; background: #0a0a0c; border-right: 1px solid #2d2d33; position: fixed; top: calc(env(safe-area-inset-top, 0) + 64px); left: 0; bottom: 0; z-index: 40; }
      main { margin-left: 260px; margin-top: calc(env(safe-area-inset-top, 0) + 64px); padding: 1.5rem; }
    }
    .queue-card { transition: all 0.2s; }
    .tag { font-size: 10px; font-weight: bold; letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="flex justify-between items-center px-4 h-14">
      <div class="flex items-center gap-2"><span class="material-symbols-outlined text-cyan-400 text-2xl">group</span><span class="font-black text-lg text-cyan-400 tracking-tight">Creator Co-Op</span></div>
      <div class="flex items-center gap-3"><img id="topbarAvatar" src="https://ui-avatars.com/api/?background=2fd9f4&color=000&name=User" class="w-8 h-8 rounded-full object-cover border border-gray-600"><button id="logoutBtn" class="material-symbols-outlined text-gray-400 hover:text-red-400 text-xl">logout</button></div>
    </div>
  </header>

  <aside class="desktop-sidebar">
    <nav class="flex-1 py-6 space-y-1">
      <a href="dashboard.html" class="sidebar-item flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-primary transition"><span class="material-symbols-outlined">dashboard</span><span>Dashboard</span></a>
      <a href="profile.html" class="sidebar-item flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-primary transition"><span class="material-symbols-outlined">person</span><span>Profile</span></a>
      <a href="queue.html" class="sidebar-active flex items-center gap-3 px-6 py-3 text-primary border-l-4 border-primary bg-gray-800/50"><span class="material-symbols-outlined">dynamic_feed</span><span>Boost Queue</span></a>
      <a href="settings.html" class="sidebar-item flex items-center gap-3 px-6 py-3 text-gray-400 hover:text-primary transition"><span class="material-symbols-outlined">settings</span><span>Settings</span></a>
    </nav>
    <div class="px-4 pb-6"><a href="new-project.html" class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-700 rounded-lg font-bold text-white flex items-center justify-center gap-2 hover:scale-105 transition-transform"><span class="material-symbols-outlined">add</span> New Project</a></div>
  </aside>

  <main>
    <div class="space-y-6">
      <div><h2 class="text-2xl md:text-3xl font-bold">Boost Queue</h2><p class="text-gray-400 text-sm">Engage with other creators' content to earn credits.</p></div>
      <div class="glass-card rounded-xl p-4 md:p-6">
        <div class="flex items-center justify-between mb-4"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-primary text-2xl">dynamic_feed</span><h3 class="text-lg md:text-xl font-bold text-white">Active Boosts</h3><span id="queueCountBadge" class="bg-gray-800 px-2 py-0.5 rounded text-[10px] font-bold text-primary">0 PENDING</span></div><button onclick="loadQueue()" class="text-gray-400 hover:text-white text-[11px] font-bold uppercase">REFRESH</button></div>
        <div id="feedList" class="space-y-4 max-h-[70vh] overflow-y-auto pr-2"></div>
      </div>
    </div>
  </main>

  <div class="bottom-tab-bar">
    <a href="dashboard.html" class="tab-item text-gray-500"><span class="material-symbols-outlined">dashboard</span><span>Home</span></a>
    <a href="profile.html" class="tab-item text-gray-500"><span class="material-symbols-outlined">person</span><span>Profile</span></a>
    <a href="queue.html" class="tab-item text-cyan-400"><span class="material-symbols-outlined">dynamic_feed</span><span>Queue</span></a>
    <a href="settings.html" class="tab-item text-gray-500"><span class="material-symbols-outlined">settings</span><span>Settings</span></a>
    <a href="new-project.html" class="tab-item text-gray-500"><span class="material-symbols-outlined">add_circle</span><span>Boost</span></a>
  </div>

  <script>
    const API_BASE = location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://creator-coop-backend.onrender.com/api';
    function getToken() { return localStorage.getItem('coop_token'); }
    async function authFetch(endpoint, opts={}) {
      const token = getToken();
      if (!token) throw new Error('No token');
      const res = await fetch(`${API_BASE}${endpoint}`, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...opts.headers } });
      if (res.status === 401) { localStorage.clear(); location.href = 'landing.html'; throw new Error('Session expired'); }
      return res;
    }
    function timeAgo(date) { const s = Math.floor((new Date() - new Date(date))/1000); let i = Math.floor(s/3600); if(i>=24) return `${Math.floor(i/24)}d ago`; if(i>=1) return `${i}h ago`; i=Math.floor(s/60); if(i>=1) return `${i}m ago`; return `${s}s ago`; }
    function getDomain(url) { try { return new URL(url).hostname.replace(/^www\./,''); } catch(e){ return url; } }
    async function loadQueue() {
      const container = document.getElementById('feedList');
      container.innerHTML = '<div class="text-center text-gray-500 py-10">Loading tasks...</div>';
      try {
        const data = await (await authFetch('/links/feed')).json();
        if (!data.feed || data.feed.length === 0) { container.innerHTML = '<div class="text-center text-gray-500 py-10">No active boosts in queue.</div>'; document.getElementById('queueCountBadge').innerText = '0 PENDING'; return; }
        document.getElementById('queueCountBadge').innerText = `${data.feed.length} PENDING`;
        container.innerHTML = '';
        for(const item of data.feed) {
          const username = item.creator_username || 'Anonymous';
          const url = item.link_url;
          const linkId = item.link_id;
          const postedTime = timeAgo(item.created_at);
          const domain = getDomain(url);
          let tag = 'SOCIAL BOOST', tagColor = 'border-primary/30 text-primary';
          if(domain.includes('github')) { tag = 'DEV SUPPORT'; tagColor = 'border-blue-500/30 text-blue-400'; }
          else if(domain.includes('medium')||domain.includes('substack')) { tag = 'CURATED READ'; tagColor = 'border-purple-500/30 text-purple-400'; }
          const card = document.createElement('div');
          card.className = 'queue-card glass-card rounded-lg p-4 space-y-3';
          card.innerHTML = `<div><div class="flex items-center gap-2"><span class="tag px-2 py-0.5 rounded-full border ${tagColor}">${tag}</span><span class="text-xs text-gray-500">• Posted ${postedTime}</span></div></div><div><h4 class="font-bold text-white">${escapeHtml(username)}</h4><div class="flex items-center gap-2 mt-1"><span class="text-xs text-gray-400">${domain}</span><span class="text-xs text-primary">+1 Credit</span></div></div><div class="flex gap-3 pt-2"><button class="step1 step-btn bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-bold" data-url="${url}">1. Open Link</button><button class="step2 step-btn bg-gray-800/50 text-gray-500 px-4 py-2 rounded-lg text-sm font-bold cursor-not-allowed" disabled>2. Mark Engaged</button></div>`;
          container.appendChild(card);
          const step1 = card.querySelector('.step1');
          const step2 = card.querySelector('.step2');
          step1.onclick = () => { window.open(step1.dataset.url, '_blank'); step1.innerHTML = '✓ Opened'; step1.disabled = true; step1.classList.add('bg-green-600','cursor-default'); step2.disabled = false; step2.classList.remove('bg-gray-800/50','text-gray-500','cursor-not-allowed'); step2.classList.add('bg-primary','text-black','cursor-pointer','hover:bg-cyan-300'); };
          step2.onclick = async () => { if(step2.disabled) return; step2.disabled = true; step2.innerText = 'Processing...'; try { await authFetch('/links/engage', { method: 'POST', body: JSON.stringify({ link_id: linkId }) }); card.remove(); loadQueue(); } catch(err){ alert('Engagement failed'); step2.disabled = false; step2.innerText = '2. Mark Engaged'; } };
        }
      } catch(e){ console.error(e); container.innerHTML = '<div class="text-center text-red-400 py-10">Failed to load queue. Refresh.</div>'; }
    }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    async function loadUser() { try { const me = await (await authFetch('/auth/me')).json(); document.getElementById('topbarAvatar').src = `https://ui-avatars.com/api/?background=2fd9f4&color=000&name=${encodeURIComponent(me.user.username)}`; } catch(e){} }
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); location.href='landing.html'; };
    (async()=>{ if(!getToken()) location.href='landing.html'; await loadUser(); await loadQueue(); })();
  </script>
</body>
</html>
