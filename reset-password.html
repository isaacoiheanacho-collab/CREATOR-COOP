<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Creator Co-Op | Reset Password</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563EB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Creator Co-Op">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/co-creators.png">
    <meta name="msapplication-TileImage" content="icons/co-creators.png">
    <meta name="msapplication-TileColor" content="#2563EB">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .password-wrapper { position: relative; }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-[#f4f6f9] flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full mx-4">
        <div class="text-center mb-6">
            <span class="material-symbols-outlined text-5xl text-blue-600">lock_reset</span>
            <h1 class="text-2xl font-bold text-zinc-800 mt-2">Reset Password</h1>
            <p class="text-zinc-500 text-sm mt-1">Enter your new password below</p>
        </div>

        <form id="reset-form">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-zinc-700 mb-1">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" required minlength="6" class="w-full rounded-lg border-zinc-300 shadow-sm focus:border-blue-500 px-3 py-2 pr-10">
                    <span class="password-toggle material-symbols-outlined" onclick="togglePassword('new-password', this)">visibility_off</span>
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-zinc-700 mb-1">Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" required minlength="6" class="w-full rounded-lg border-zinc-300 shadow-sm focus:border-blue-500 px-3 py-2 pr-10">
                    <span class="password-toggle material-symbols-outlined" onclick="togglePassword('confirm-password', this)">visibility_off</span>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition duration-150">
                Reset Password
            </button>
        </form>

        <div id="message" class="mt-4 text-sm text-center hidden"></div>
        
        <div class="text-center mt-6">
            <a href="landing.html" class="text-blue-600 hover:underline text-sm">Back to Login</a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5000/api'
            : 'https://creator-coop-backend.onrender.com/api';

        // Get token and email from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.textContent = 'visibility';
            } else {
                input.type = 'password';
                iconElement.textContent = 'visibility_off';
            }
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            if (newPassword !== confirmPassword) {
                messageDiv.innerHTML = '<span class="text-red-600">⚠️ Passwords do not match.</span>';
                messageDiv.classList.remove('hidden');
                return;
            }

            if (newPassword.length < 6) {
                messageDiv.innerHTML = '<span class="text-red-600">⚠️ Password must be at least 6 characters.</span>';
                messageDiv.classList.remove('hidden');
                return;
            }

            if (!token || !email) {
                messageDiv.innerHTML = '<span class="text-red-600">⚠️ Invalid reset link. Please request a new one.</span>';
                messageDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Resetting...';
            messageDiv.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, email, new_password: newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    messageDiv.innerHTML = '<span class="text-green-600">✓ ' + data.message + '</span>';
                    messageDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = 'landing.html';
                    }, 2000);
                } else {
                    messageDiv.innerHTML = '<span class="text-red-600">⚠️ ' + (data.error || 'Reset failed. Please try again.') + '</span>';
                    messageDiv.classList.remove('hidden');
                }
            } catch (err) {
                messageDiv.innerHTML = '<span class="text-red-600">⚠️ Cannot connect to server. Please try again later.</span>';
                messageDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Reset Password';
            }
        });
    </script>
</body>
</html>
