<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Co-Op</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b1326">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Creator Co-Op">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    
    <!-- Primary Icon - Your New Logo (try first) -->
    <link rel="apple-touch-icon" href="icons/co-creators.png">
    
    <!-- Fallback to old working icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-200.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-150.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-100.png">
    
    <!-- Windows / Android -->
    <meta name="msapplication-TileImage" content="icons/icon-150.png">
    <meta name="msapplication-TileColor" content="#0b1326">
    
    <style>
        body { font-family: system-ui; background: #0a0a0c; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .loader { border: 3px solid #1f2937; border-top: 3px solid #2fd9f4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <p>Loading...</p>
    </div>
    <script>
        const token = localStorage.getItem('coop_token');
        if (token) {
            window.location.replace('/dashboard.html');
        } else {
            window.location.replace('/landing.html');
        }
    </script>
</body>
</html>
