<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Creator Co-Op | Dashboard</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0b1326">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Creator Co-Op">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  
  <link rel="apple-touch-icon" href="icons/icon-200.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-150.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-100.png">
  <meta name="msapplication-TileImage" content="icons/icon-150.png">
  <meta name="msapplication-TileColor" content="#0b1326">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0c;
      font-family: 'Inter', sans-serif;
      color: #e5e7eb;
      padding-bottom: 70px;
    }
    
    /* Simple Top Header */
    .top-header {
      background: #0a0a0c;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d2d33;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      color: #2fd9f4;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2fd9f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0a0a0c;
    }
    
    /* Main Container */
    .main-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    
    /* Welcome Card */
    .welcome-card {
      background: #1a1a1e;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2d2d33;
    }
    .welcome-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .welcome-card p {
      font-size: 14px;
      color: #9ca3af;
    }
    
    /* Stats Grid - 2x2 */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #1a1a1e;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #2d2d33;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #9ca3af;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: white;
    }
    .stat-sub {
      font-size: 11px;
      color: #4ade80;
      margin-top: 6px;
    }
    .stat-sub-muted {
      color: #6b7280;
    }
    
    /* My Boosts Section */
    .boosts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .boosts-header h3 {
      font-size: 18px;
      font-weight: 700;
    }
    .refresh-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .boosts-table {
      width: 100%;
      background: #1a1a1e;
      border-radius: 16px;
      border: 1px solid #2d2d33;
      overflow: hidden;
    }
    .boosts-table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #9ca3af;
      background: #141418;
      border-bottom: 1px solid #2d2d33;
    }
    .boosts-table td {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid #2d2d33;
      color: #e5e7eb;
    }
    .boosts-table tr:last-child td {
      border-bottom: none;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
    }
    .status-active { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
    .status-queued { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
    .status-completed { background: rgba(107, 114, 128, 0.2); color: #9ca3af; }
    
    /* Bottom Navigation - 3 Icons */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0a0a0c;
      border-top: 1px solid #2d2d33;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 20px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: #6b7280;
      transition: color 0.2s;
      font-size: 12px;
    }
    .nav-item span:first-child {
      font-size: 24px;
    }
    .nav-item.active {
      color: #2fd9f4;
    }
    .nav-item:hover {
      color: #2fd9f4;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
    
    .btn-new-project {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      width: 100%;
      margin-top: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Simple Top Header -->
  <div class="top-header">
    <span class="logo">Creator Co-Op</span>
    <div class="avatar" id="avatarDisplay">JA</div>
  </div>

  <!-- Main Content -->
  <div class="main-container">
    
    <!-- Welcome Card -->
    <div class="welcome-card">
      <h2 id="welcomeName">Welcome back, Ihenz</h2>
      <p>The collective is moving fast today.</p>
    </div>

    <!-- Stats Grid 2x2 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">BOOSTS USED</div>
        <div class="stat-value"><span id="boostsUsed">0</span> <span style="font-size: 14px; color:#6b7280;">/ 1</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">NEXT BOOST</div>
        <div class="stat-value" style="font-size: 20px;" id="nextBoost">Ready</div>
        <div class="stat-sub-muted" style="font-size: 10px;">Immediate</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">TOTAL ENGAGEMENTS</div>
        <div class="stat-value" id="totalEngagements">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">MEMBERSHIP</div>
        <div class="stat-value" style="font-size: 20px;" id="membershipStatus">Inactive</div>
        <div class="stat-sub-muted" style="font-size: 10px;" id="membershipSub">No active plan</div>
      </div>
    </div>

    <!-- My Boosts Section -->
    <div class="boosts-header">
      <h3>My Boosts</h3>
      <button class="refresh-btn" onclick="loadBoosts()">REFRESH</button>
    </div>

    <div class="boosts-table">
      <table style="width: 100%;">
        <thead>
          <tr><th>Link</th><th>Date</th><th>Status</th><th>Eng.</th></tr>
        </thead>
        <tbody id="boostsTableBody">
          <tr><td colspan="4" class="empty-state">No boosts yet. Click + New Project.</td></tr>
        </tbody>
      </table>
    </div>

    <button class="btn-new-project" onclick="window.location.href='new-project.html'">
      + New Project
    </button>
  </div>

  <!-- Bottom Navigation - 3 Icons -->
  <div class="bottom-nav">
    <a href="profile.html" class="nav-item">
      <span class="material-symbols-outlined">person</span>
      <span>Profile</span>
    </a>
    <a href="queue.html" class="nav-item">
      <span class="material-symbols-outlined">dynamic_feed</span>
      <span>Status</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span class="material-symbols-outlined">settings</span>
      <span>Settings</span>
    </a>
  </div>

  <script>
    const API_BASE = location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://creator-coop-backend.onrender.com/api';
    
    function getToken() { return localStorage.getItem('coop_token'); }
    
    async function authFetch(endpoint, opts = {}) {
      const token = getToken();
      if (!token) throw new Error('No token');
      const res = await fetch(`${API_BASE}${endpoint}`, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...opts.headers }
      });
      if (res.status === 401) {
        localStorage.clear();
        location.href = 'landing.html';
        throw new Error('Session expired');
      }
      return res;
    }

    async function loadDashboard() {
      try {
        const me = await (await authFetch('/auth/me')).json();
        const username = me.user.username || 'Creator';
        document.getElementById('welcomeName').innerText = `Welcome back, ${username}`;
        document.getElementById('avatarDisplay').innerText = username.substring(0, 2).toUpperCase();
        
        const membershipActive = me.subscription_active;
        document.getElementById('membershipStatus').innerText = membershipActive ? 'Active' : 'Inactive';
        document.getElementById('membershipSub').innerText = membershipActive ? 'Annual plan' : 'No active plan';
        
        const boosts = await (await authFetch('/boosts?limit=100')).json();
        const boostsList = boosts.boosts || [];
        const totalEng = boostsList.reduce((s, b) => s + (b.engagement_count || 0), 0);
        document.getElementById('totalEngagements').innerText = totalEng;
        
        const lastPost = await (await authFetch('/links/last-post')).json();
        const canPost = !lastPost.lastPost || (new Date() - new Date(lastPost.lastPost)) >= 86400000;
        document.getElementById('boostsUsed').innerText = canPost ? '0' : '1';
        document.getElementById('nextBoost').innerText = canPost ? 'Ready' : `${Math.ceil(24 - (new Date() - new Date(lastPost.lastPost)) / 3600000)}h`;
        
        await loadBoosts();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadBoosts() {
      const tbody = document.getElementById('boostsTableBody');
      try {
        const data = await (await authFetch('/boosts?limit=100')).json();
        const boosts = data.boosts || [];
        
        if (boosts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No boosts yet. Click + New Project.</td></tr>';
          return;
        }
        
        tbody.innerHTML = boosts.map(b => `
          <tr>
            <td><a href="${b.original_url}" target="_blank" style="color:#2fd9f4; text-decoration:none;">${b.original_url?.substring(0, 30)}...</a></td>
            <td>${new Date(b.submitted_at).toLocaleDateString()}</td>
            <td><span class="status-badge ${b.status === 'active' ? 'status-active' : (b.status === 'queued' ? 'status-queued' : 'status-completed')}">${b.status?.toUpperCase() || 'PENDING'}</span></td>
            <td>${b.engagement_count || 0}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Failed to load boosts</td></tr>';
      }
    }

    // Check auth
    if (!getToken()) {
      location.href = 'landing.html';
    } else {
      loadDashboard();
    }
  </script>
</body>
</html>
